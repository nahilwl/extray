[project]
name = "extray"
version = "0.3.2"
description = "X-ray browser extensions: malware verdict, exploitable vulns, version diff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# tree-sitter 0.26.0 segfaults during garbage collection on large extensions (e.g. Google Translate)
# typer 0.19 is the first to accept Literal options (--min-severity)
dependencies = ["typer>=0.19", "rich", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23", "jsbeautifier"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
extray = "extray.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["network: needs internet access (Chrome Web Store), excluded in CI"]
